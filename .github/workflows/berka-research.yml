name: Berka banking research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/berka-research.yml'
      - 'research_berka.py'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6 pymysql==1.1.1 openai==2.8.1
      - name: Analyze Berka
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python research_berka.py
      - uses: actions/upload-artifact@v4
        with:
          name: berka-research-results
          path: |
            berka_loan_results.csv
            berka_protocol.json
